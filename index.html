<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="next5" />
    <meta
      name="description"
      content="Free youth basketball rotation app. Plan fair playing time and lineups by position, then run subs with one tap on game day. Works offline on iPhone."
    />
    <link rel="canonical" href="https://mattbat.com/next5/" />
    <!-- Link previews in Messages, team chats and social apps. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="next5" />
    <meta property="og:title" content="next5 — Youth Basketball Rotation & Substitution App" />
    <meta
      property="og:description"
      content="Fair playing time, lineups by position and one-tap subs on game day. Free, no account, works offline on iPhone."
    />
    <meta property="og:url" content="https://mattbat.com/next5/" />
    <meta property="og:image" content="https://mattbat.com/next5/pwa-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- The Home Screen name comes from apple-mobile-web-app-title, so this can say more. -->
    <title>next5 — Youth Basketball Rotation &amp; Substitution App</title>
    <script>
      // Light or dark before the app loads, so it never flashes the wrong one
      // (D10). Same logic as applyTheme in src/theme.ts.
      (function () {
        var pref = "dark";
        try {
          pref = localStorage.getItem("next5.theme") || "dark";
        } catch (e) {}
        var light = pref === "light" || (pref === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
        document.querySelector("meta[name=theme-color]").setAttribute("content", light ? "#f4f6fa" : "#0b0f17");
        // Dark status bar text on the light theme; the Home Screen app reads this at launch.
        if (light) document.querySelector("meta[name=apple-mobile-web-app-status-bar-style]").setAttribute("content", "default");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>next5: youth basketball rotation and substitution app</h1>
      <p>
        next5 is a free iPhone app for youth basketball coaches. Enter your roster once, mark who showed up, and it builds a
        rotation with fair playing time that always has the positions you need on the court. On game day it shows who comes
        in and who goes out at each substitution. It also plans practices. No account, no App Store, works offline.
        Turn on JavaScript to use it.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
